services:
  postgres:
    image: postgres:16
    container_name: bubbles_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16